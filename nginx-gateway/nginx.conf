events {}

http {
    upstream accounts_pool {
        server accounts:8080 max_fails=3 fail_timeout=30s;
    }

    upstream events_pool {
        server events:8080 max_fails=3 fail_timeout=30s;
    }

    upstream status_pool {
        server status:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;

        location /api/accounts {
            proxy_pass http://accounts_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/events {
            proxy_pass http://events_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://status_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx-gateway-heartbeat {
            add_header Content-Type text/plain;
            return 200 "nginx gateway alive";
        }
    }
}
