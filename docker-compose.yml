services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 5s
      timeout: 5s
      retries: 10

  accounts:
    build: ./backend
    environment:
      SERVICE_ID: "accounts-1"
      DATABASE_URL: "host=postgres user=soc password=soc dbname=soc port=5432 sslmode=disable"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  events:
    build: ./events
    environment:
      SERVICE_ID: "events-1"
      DATABASE_URL: "host=postgres user=soc password=soc dbname=soc port=5432 sslmode=disable"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  status:
    build: ./status
    environment:
      SERVICE_ID: "status-1"
      SQLITE_PATH: "/data/status.db"
      PORT: "8080"
    volumes:
      - statusdata:/data

  middleware:
    build: ./middleware
    environment:
      PORT: "9000"
    ports:
      - "9000:9000"
    depends_on:
      - accounts
      - events
      - status

  nginx-gateway:
    build: ./nginx-gateway
    ports:
      - "8000:8000"
    depends_on:
      - accounts
      - events
      - status

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:9000
    ports:
      - "3000:3000"
    depends_on:
      - middleware

volumes:
  pgdata:
  statusdata:
