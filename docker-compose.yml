services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 5s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:latest
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"

  # kafka en modo KRaft osea sin zookeeper, un solo nodo que es broker y controller
  # misma imagen que el kafka_example del profe
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      # 29092 es pa probar desde tu compu, los contenedores usan kafka:9092
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # dos puertas pa entrar -> INTERNAL pa los contenedores y EXTERNAL pa tu compu
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # lo que kafka le dice al cliente que use pa reconectarse
      # tiene que ser una direccion que el cliente alcance y por eso hay una por cada puerta
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  accounts:
    build: ./backend
    environment:
      SERVICE_ID: "accounts-1"
      SERVICE_NAME: "accounts"
      SERVICE_ADDRESS: "accounts"
      CONSUL_HTTP_ADDR: "http://consul:8500"
      DATABASE_URL: "host=postgres user=soc password=soc dbname=soc port=5432 sslmode=disable"
      PORT: "8080"
      # accounts avisa de logins y registros publicando en el topico accounts.activity
      KAFKA_BROKERS: "kafka:9092"
      # el aviso por grpc directo a events sigue en el codigo pero solo se usa si no hay KAFKA_BROKERS
      # EVENTS_GRPC_ADDR: "events:50051"
    ports:
      # puerto grpc de afuera -> adentro pa probar con grpcurl desde tu compu
      - "50051:50051"
    depends_on:
      kafka:
        condition: service_healthy
      consul:
        condition: service_started
      postgres:
        condition: service_healthy

  events:
    build: ./events
    environment:
      SERVICE_ID: "events-1"
      SERVICE_NAME: "events"
      SERVICE_ADDRESS: "events"
      CONSUL_HTTP_ADDR: "http://consul:8500"
      DATABASE_URL: "host=postgres user=soc password=soc dbname=soc port=5432 sslmode=disable"
      PORT: "8080"
      # lee accounts.activity y publica en events.created
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "50052:50051"
    depends_on:
      kafka:
        condition: service_healthy
      consul:
        condition: service_started
      postgres:
        condition: service_healthy

  status:
    build: ./status
    environment:
      SERVICE_ID: "status-1"
      SERVICE_NAME: "status"
      SERVICE_ADDRESS: "status"
      CONSUL_HTTP_ADDR: "http://consul:8500"
      SQLITE_PATH: "/data/status.db"
      PORT: "8080"
      # lee events.created y cuenta los eventos
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "50053:50051"
    volumes:
      - statusdata:/data
    depends_on:
      kafka:
        condition: service_healthy
      consul:
        condition: service_started

  middleware:
    build: ./middleware
    environment:
      CONSUL_HTTP_ADDR: "http://consul:8500"
      PORT: "9000"
    ports:
      - "9000:9000"
      # grpc del load balancer que reenvia a los servicios *-grpc de consul
      - "9001:9001"
    depends_on:
      - consul
      - accounts
      - events
      - status

  nginx-gateway:
    build: ./nginx-gateway
    ports:
      - "8000:8000"
    depends_on:
      - accounts
      - events
      - status

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:9000
    ports:
      - "3000:3000"
    depends_on:
      - middleware

volumes:
  pgdata:
  statusdata:
