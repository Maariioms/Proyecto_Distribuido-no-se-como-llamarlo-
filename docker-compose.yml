services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-1:
    build: ./backend
    environment:
      DATABASE_URL: "host=postgres user=soc password=soc dbname=soc port=5432 sslmode=disable"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend-2:
    build: ./backend
    environment:
      DATABASE_URL: "host=postgres user=soc password=soc dbname=soc port=5432 sslmode=disable"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  middleware:
    build: ./middleware
    environment:
      WORKERS: "http://backend-1:8080,http://backend-2:8080"
      PORT: "9000"
    ports:
      - "9000:9000"
    depends_on:
      - backend-1
      - backend-2

volumes:
  pgdata:
